# Render Blueprint: Sensoriqua 2 (single app = API + GUI)
# https://docs.render.com/blueprint-spec
# Frontend is built during deploy and copied to backend/static; one URL serves both API and GUI.

services:
  - type: web
    name: sensoriqua
    runtime: python
    region: oregon

    # Wipe + rebuild frontend into backend/static (avoids serving stale committed assets)
    buildCommand: |
      cd frontend && npm ci && npm run build
      rm -rf ../backend/static
      mkdir -p ../backend/static && cp -a dist/. ../backend/static/
      cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: NODE_VERSION
        value: "20.18.0"
      # Required behind Render's reverse proxy so login rate limits use the real client IP
      - key: TRUST_PROXY
        value: "1"
      # Use SQLite for app state so configured_sensors/dashboard work without app_sensoriqua schema in Postgres
      - key: SENSORIQUA_APP_STATE_DSN
        value: "sqlite:///sensoriqua_state.db"
      # Public deploys must require JWT (Navixy App Connect). Set JWT_SECRET in the dashboard.
      - key: REQUIRE_AUTH
        value: "1"
      # Set in Render Dashboard → Environment (Secrets):
      # JWT_SECRET — required (min 32 chars) when REQUIRE_AUTH=1 / Navixy
      # LOGIN_API_KEY — optional; leave UNSET for standard Navixy App Connect (middleware has no custom header)
      # CORS_ORIGINS — your Render URL, e.g. https://sensoriqua.onrender.com
      # ALLOW_PRIVATE_DSN=1 — only if Navixy iotDbUrl/userDbUrl point at private IPs
      # Do NOT set ALLOW_CLIENT_DSN / ALLOW_CLIENT_USER_ID on public internet
      # SENSORIQUA_DSN — standalone only; incompatible with REQUIRE_AUTH=1 unless JWT is also configured
